name: SABench native AnnData verification
on:
  push:
    branches: [main]
    paths: ['research/sabench-rotation/verify_native.py', '.github/workflows/sabench-native.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native data-container dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 anndata==0.10.9 'zarr<3'
      - name: Verify pinned sources and execute original scoring functions
        run: |
          set -o pipefail
          python research/sabench-rotation/verify_native.py | tee sabench-native.log
          python -m pip freeze > sabench-native-environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sabench-native-evidence
          path: |
            research/sabench-rotation/native-results
            sabench-native.log
            sabench-native-environment.txt
          retention-days: 90
