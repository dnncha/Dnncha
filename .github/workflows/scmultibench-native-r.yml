name: scMultiBench native R evaluator
on:
  pull_request:
    paths: ['research/scmultibench-native-r/**', '.github/workflows/scmultibench-native-r.yml']
  push:
    branches: [main]
    paths: ['research/scmultibench-native-r/**', '.github/workflows/scmultibench-native-r.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: false
      - name: Verify complete upstream source and released demo inputs
        run: python research/scmultibench-native-r/fetch_sources.py
      - name: Execute original and corrected evaluator in native R
        run: |
          set -o pipefail
          Rscript research/scmultibench-native-r/reproduce.R | tee native-r.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scmultibench-native-r-evidence
          path: |
            research/scmultibench-native-r/inputs/manifest.json
            research/scmultibench-native-r/results
            native-r.log
          retention-days: 90
